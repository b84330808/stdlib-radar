[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stdlib-radar"
dynamic = ["version"]
description = "Find uses of standard library APIs removed or changed in Python 3.13, 3.14 and 3.15, in your code and in your installed dependencies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wei-Lun Li" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["python-upgrade", "deprecation", "stdlib", "static-analysis", "python313", "python314", "python315"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/b84330808/stdlib-radar"
Issues = "https://github.com/b84330808/stdlib-radar/issues"

[project.scripts]
stdlib-radar = "stdlib_radar.cli:main"

[tool.hatch.version]
path = "src/stdlib_radar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stdlib_radar"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
